[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecohydro-sm"
version = "0.1.0"
description = "SAR + 光学融合的生态水文土壤水生产管线（表层—根区—含水层三层闭合）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ecohydro-sm contributors" }]
keywords = ["soil moisture", "Sentinel-1", "Sentinel-2", "InSAR", "ecohydrology", "data fusion"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Intended Audience :: Science/Research",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
geo = ["rasterio>=1.3", "xarray>=2023.1", "geopandas>=0.13", "pyproj>=3.5"]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.1", "black>=23.9"]

[tool.setuptools.packages.find]
where = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
